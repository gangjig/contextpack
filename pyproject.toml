[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextpack"
version = "0.1.0"
description = "Assemble LLM context under a hard token budget: priority selection, explicit drop/truncate policies, and a manifest of every decision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gang Ji" }]
keywords = ["llm", "context-window", "agents", "prompt-engineering", "token-budget"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
contextpack = "contextpack.cli:main"

[project.urls]
Homepage = "https://github.com/gangjig/contextpack"
Repository = "https://github.com/gangjig/contextpack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
